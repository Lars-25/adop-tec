<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../img/icono.ico">
    <title>Reporte | AdopTec</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/theme.js"></script>
</head>
<body>

<nav class="nav-bar">
    <a href="perfil.html" class="nav-bar__back">
        <i class='bx bx-arrow-back'></i> Volver
    </a>
    <h2 class="nav-bar__title">Publicar Reporte</h2>
</nav>

<main class="container" id="appForm" style="max-width: 600px; padding-top: 2rem;">
    <div class="card">
        <h2 class="card__title mb-4">
            <i class='bx bx-edit'></i> Detalles
        </h2>
        <form id="formReporte">
            <div class="form-group">
                <label class="form-label">Nombre</label>
                <input id="nombre" type="text" class="form-input" placeholder="Ej: Firulais">
            </div>
            <div class="form-group">
                <label class="form-label">Especie</label>
                <select id="especie" class="form-input">
                    <option value="perro">Perro</option>
                    <option value="gato">Gato</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Ubicación</label>
                <input id="ubicacion" type="text" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Descripción</label>
                <textarea id="descripcion" class="form-input" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Fotografía</label>
                <div class="file-upload-wrapper">
                    <input id="imagen" type="file" accept="image/*" class="file-upload-input">
                    <label for="imagen" class="file-upload-label" id="imagenPreviewLabel">
                        <i class='bx bx-camera' style="font-size: 2rem; color: #a0aec0;"></i>
                        <span id="imagenTexto" style="margin-top: 8px;">Haz clic para subir fotografía</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: #e63946;">
                    <input type="checkbox" id="urgente" style="width: auto; transform: scale(1.2);"> Marcar como caso Urgente
                </label>
            </div>

            <button type="submit" class="btn btn--primary">
                <i class='bx bx-check-circle'></i> Publicar Alta
            </button>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="../js/store.js"></script>
<script src="../js/formulario.js"></script>
<script src="../js/i18n.js"></script>
</body>
</html>
