<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../img/icono.ico">
    <title>Acceso | AdopTec</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <main id="appLogin" class="container" style="width: 100%; max-width: 400px;">
        <div class="auth-card text-center">
            <div class="auth-card__header mb-4">
                <i class='bx bx-user-circle text-primary' style="font-size: 4rem;"></i>
                <h1 class="auth-card__title" style="justify-content: center;">Bienvenido</h1>
                <p class="text-muted">Sistema de Autenticación ITM</p>
            </div>
            <form id="loginForm">
                <div class="input-group">
                    <label class="input-group__label">Correo Institucional</label>
                    <div class="input-group__wrapper">
                        <i class='bx bx-envelope input-group__icon'></i>
                        <input id="email" type="email" class="input-group__field" placeholder="ejemplo@morelia.tecnm.mx" required>
                    </div>
                </div>
                <div class="input-group mb-4">
                    <label class="input-group__label">Contraseña</label>
                    <div class="input-group__wrapper">
                        <i class='bx bx-lock-alt input-group__icon'></i>
                        <input id="password" type="password" class="input-group__field" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn--primary w-100">Ingresar</button>
            </form>
            <div class="mt-4" style="margin-top: 1.5rem; font-size: 0.85rem;">
                <p><a href="../index.html" class="text-muted"><i class='bx bx-arrow-back'></i> Volver al inicio</a></p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
