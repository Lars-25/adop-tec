<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../img/icono.ico">
    <title>AdopTec | ITM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div id="app">
        <header class="top-bar">
            <img src="../img/logo.jpg" alt="Logo AdopTec" class="logo-img">
            <h2 class="top-bar__title">AdopTec</h2>
            <i class='bx bx-bell text-primary' style="font-size: 1.4rem;"></i>
        </header>

        <nav class="filters">
            <button class="chip" :class="{'chip--active': filtro === 'todos'}" @click="filtro = 'todos'">Todos</button>
            <button class="chip" :class="{'chip--active': filtro === 'perro'}" @click="filtro = 'perro'"><i
                    class='bx bx-dog'></i> Perros</button>
            <button class="chip" :class="{'chip--active': filtro === 'gato'}" @click="filtro = 'gato'"><i
                    class='bx bx-cat'></i> Gatos</button>
            <button class="chip chip--urgent" :class="{'chip--active': filtro === 'urgente'}"
                @click="filtro = 'urgente'"><i class='bx bx-error-circle'></i> Urgente</button>
        </nav>

        <main class="feed-grid container">
            <article v-for="perrito in mascotasFiltradas" :key="perrito.id" class="pet-card">
                <img :src="perrito.img" class="pet-card__img">
                <div class="pet-card__body">
                    <h3 class="pet-card__title">{{ perrito.nombre }}</h3>
                    <div class="pet-card__meta"><i class='bx bx-map'></i> {{ perrito.ubicacion }}</div>
                    <div class="pet-card__meta"><i class='bx bx-time'></i> {{ perrito.tiempo }}</div>
                    <button type="button" class="pet-card__btn" @click="abrirDetalles(perrito)">Ver detalles</button>
                </div>
            </article>
        </main>

        <div v-if="perritoSeleccionado" class="modal-overlay" @click.self="perritoSeleccionado = null">
            <div class="modal-content">
                <span class="close-modal" @click="perritoSeleccionado = null">&times;</span>
                <img :src="perritoSeleccionado.img" class="modal-img">
                <h2 class="text-primary">{{ perritoSeleccionado.nombre }}</h2>
                <p class="mb-3"><b>Ubicación:</b> {{ perritoSeleccionado.ubicacion }}</p>
                <p class="text-muted">{{ perritoSeleccionado.descripcion }}</p>
                <button class="btn-primary mt-3" style="margin-top: 15px;">¡Quiero adoptar!</button>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="feed.html" class="nav-item nav-item--active"><i class='bx bx-home-alt-2'></i> Feed</a>
            <a href="donaciones.html" class="nav-item"><i class='bx bx-donate-heart'></i> Donar</a>
            <a href="perfil.html" class="nav-item"><i class='bx bx-user'></i> Perfil</a>
        </nav>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="dinamismo.js"></script>
</body>

</html>
