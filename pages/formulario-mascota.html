<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../img/icono.ico">
    <title>Reporte | AdopTec</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>
<body>
    <nav class="nav-bar">
        <a href="perfil.html" class="nav-bar__back"><i class='bx bx-arrow-back'></i> Volver</a>
        <h2 class="nav-bar__title">Publicar Reporte</h2>
    </nav>

    <main class="container" id="appForm" style="max-width: 600px; padding-top: 2rem;">
        <div class="card">
            <h2 class="card__title mb-4"><i class='bx bx-edit'></i> Detalles</h2>
            
            <form @submit.prevent="publicar">
                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" v-model="nombre" class="form-input" placeholder="Ej: Firulais">
                </div>
                <div class="form-group">
                    <label class="form-label">Especie</label>
                    <select v-model="especie" class="form-input">
                        <option value="perro">Perro</option>
                        <option value="gato">Gato</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Ubicación</label>
                    <input type="text" v-model="ubicacion" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Descripción</label>
                    <textarea v-model="descripcion" class="form-input" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Fotografía</label>
                    <input type="file" class="form-input" style="background: white;" accept="image/*" @change="procesarImagen">
                </div>
                
                <button type="submit" class="btn btn--primary"><i class='bx bx-check-circle'></i> Publicar Alta</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/formulario.js"></script>
</body>
</html>
