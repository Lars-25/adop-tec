<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../img/icono.ico">
    <title>Mascotas | AdopTec</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div id="appFeed">

    <header class="top-bar">
        <h2 class="top-bar__title">AdopTec</h2>
        <i class='bx bx-bell text-primary' style="font-size: 1.4rem;"></i>
    </header>

    <nav class="filters">
        <button class="chip" id="filtroTodos">Todos</button>
        <button class="chip" id="filtroPerro"><i class='bx bx-dog'></i> Perros</button>
        <button class="chip" id="filtroGato"><i class='bx bx-cat'></i> Gatos</button>
        <button class="chip" id="filtroUrgente"><i class='bx bx-error-circle'></i> Urgentes</button>
    </nav>

    <main id="feedContainer" class="feed-grid container"></main>

    <div id="modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 400px; width: 90%; max-height: 85vh; display: flex; flex-direction: column; margin: auto; padding: 1.5rem;">
            <img id="modalImg" src="../img/logo.jpg" alt="Mascota" style="width: 100%; height: 220px; object-fit: cover; border-radius: 8px; flex-shrink: 0;">
            <div style="overflow-y: auto; margin-top: 1rem; flex-grow: 1; text-align: left;">
                <h2 id="modalNombre" class="text-primary">Mascota</h2>
                <p class="mb-3"><strong><i class='bx bx-map'></i> Ubicación:</strong> <span id="modalUbicacion">---</span></p>
                <p id="modalDescripcion" class="text-muted">Descripción</p>
            </div>
            <div style="margin-top: 1.5rem;">
                <a href="donaciones.html" class="btn btn--primary" style="margin-bottom: 0.5rem; text-decoration: none; display: block; text-align: center;">
                   <i class='bx bx-donate-heart'></i> ¡Donar a esta mascota!
                </a>
                <button id="cerrarModal" class="btn btn--outline w-100">Cerrar</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="feed.html" class="nav-item nav-item--active">
            <i class='bx bx-home-alt-2'></i> Feed
        </a>
        <a href="donaciones.html" class="nav-item">
            <i class='bx bx-donate-heart'></i> Donar
        </a>
        <a href="perfil.html" class="nav-item">
            <i class='bx bx-user'></i> Perfil
        </a>
    </nav>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="../js/store.js"></script>
<script src="../js/feed.js"></script>
</body>
</html>
